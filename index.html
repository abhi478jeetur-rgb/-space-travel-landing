    const { useState, useEffect, useRef } = React;
    const { motion } = window.Motion || {};

    const FADE_MS = 500;
    const FADE_OUT_LEAD = 0.55;

    function fadeTo(element, target, duration) {
      if (element._fadeRafId) cancelAnimationFrame(element._fadeRafId);
      const startOpacity = parseFloat(element.style.opacity) || 0;
      const startTime = performance.now();
      
      function step(currentTime) {
        const elapsed = currentTime - startTime;
        const progress = Math.min(elapsed / duration, 1);
        const eased = 1 - Math.pow(1 - progress, 3);
        const newOpacity = startOpacity + (target - startOpacity) * eased;
        element.style.opacity = newOpacity;
        if (progress < 1) {
          element._fadeRafId = requestAnimationFrame(step);
        }
      }
      element._fadeRafId = requestAnimationFrame(step);
    }

    function FadingVideo({ src, className = "", style = {} }) {
      const videoRef = useRef(null);
      const fadingOutRef = useRef(false);
      
      useEffect(() => {
        const video = videoRef.current;
        if (!video) return;
        
        video.style.opacity = 0;
        
        const handleCanPlay = () => {
          video.classList.add('loaded');
          video.play().catch(() => {});
          fadeTo(video, 1, FADE_MS);
        };
        
        const handleTimeUpdate = () => {
          if (fadingOutRef.current) return;
          const duration = video.duration;
          const currentTime = video.currentTime;
          if (duration && currentTime && duration - currentTime <= FADE_OUT_LEAD && duration - currentTime > 0) {
            fadingOutRef.current = true;
            fadeTo(video, 0, FADE_MS);
          }
        };
        
        const handleEnded = () => {
          video.style.opacity = 0;
          fadingOutRef.current = false;
          setTimeout(() => {
            video.currentTime = 0;
            video.play().catch(() => {});
            fadeTo(video, 1, FADE_MS);
          }, 100);
        };
        
        video.addEventListener('canplay', handleCanPlay);
        video.addEventListener('timeupdate', handleTimeUpdate);
        video.addEventListener('ended', handleEnded);
        
        return () => {
          if (video._fadeRafId) cancelAnimationFrame(video._fadeRafId);
          video.removeEventListener('canplay', handleCanPlay);
          video.removeEventListener('timeupdate', handleTimeUpdate);
          video.removeEventListener('ended', handleEnded);
        };
      }, [src]);
      
      return (
        <video
          ref={videoRef}
          src={src}
          autoPlay
          muted
          playsInline
          preload="auto"
          className={className}
          style={{ ...style, opacity: 0 }}
        />
      );
    }

    function BlurText({ text, className = "" }) {
      const [visible, setVisible] = useState(false);
      const ref = useRef(null);
      
      useEffect(() => {
        const observer = new IntersectionObserver(
          ([entry]) => {
            if (entry.isIntersecting && entry.intersectionRatio >= 0.1) {
              setVisible(true);
              observer.disconnect();
            }
          },
          { threshold: 0.1 }
        );
        if (ref.current) observer.observe(ref.current);
        return () => observer.disconnect();
      }, []);
      
      const words = text.split(' ');
      
      return (
        <p ref={ref} className={`blur-text-parent ${className}`}>
          {words.map((word, i) => (
            motion ? (
              <motion.span
                key={i}
                className="blur-text-word"
                initial={{ filter: 'blur(10px)', opacity: 0, y: 50 }}
                animate={visible ? {
                  filter: ['blur(10px)', 'blur(5px)', 'blur(0px)'],
                  opacity: [0, 0.5, 1],
                  y: [50, -5, 0]
                } : {}}
                transition={{
                  duration: 0.7,
                  times: [0, 0.5, 1],
                  ease: "easeOut",
                  delay: (i * 100) / 1000
                }}
              >
                {word}
              </motion.span>
            ) : (
              <span key={i} className="blur-text-word">{word}</span>
            )
          ))}
        </p>
      );
    }

    function Animated({ children, delay = 0 }) {
      if (!motion) return children;
      return (

          animate={{ filter: 'blur(0px)', opacity: 1, y: 0 }}

                      <h3 style={{ fontFamily: "'Instrument Serif', serif", fontStyle: 'italic', color: '#fff', fontSize: '1.875rem', md: { fontSize: '2.25rem' }, letterSpacing: '-0.05em', lineHeight: 1 }}>{card.title}</h3>
                      <p style={{ marginTop: '0.75rem', fontSize: '0.875rem', color: 'rgba(255,255,255,0.9)', fontFamily: "'Barlow', sans-serif", fontWeight: 300, lineHeight: 1.5, maxWidth: '32ch' }}>{card.body}</p>
                    </div>
                  </div>
                ))}
              </div>
            </div>
          </section>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
